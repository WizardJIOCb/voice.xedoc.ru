<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Небольшая новелла · Voice</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">BOOK STUDIO</p>
        <h1>Новелла → аудио</h1>
        <p>Опишите историю, отредактируйте текст и отправьте её на качественную F5‑озвучку.</p>
      </div>
      <a class="quiet link-button" href="/">Озвучка текста</a>
    </header>

    <section>
      <form id="brief-form">
        <div class="book-grid">
          <label>Жанр<select id="genre"><option>Лирическая новелла</option><option>Мистическая история</option><option>Научная фантастика</option><option>Детективная миниатюра</option><option>Сказка для взрослых</option></select></label>
          <label>Настроение<select id="mood"><option>Атмосферный и тёплый</option><option>Тревожный и загадочный</option><option>Светлый и вдохновляющий</option><option>Мрачный и кинематографичный</option></select></label>
          <label>Объём<select id="length"><option value="2500">Короткая · ~2500 знаков</option><option value="4500" selected>Средняя · ~4500 знаков</option><option value="6000">Длинная · ~6000 знаков</option></select></label>
          <label>Главный герой<input id="hero" value="безымянный рассказчик" maxlength="240"></label>
          <label class="wide">Место и время<input id="setting" value="маленький город поздней осенью" maxlength="240"></label>
        </div>
        <label>Завязка<textarea id="premise" required minlength="12" maxlength="3000" placeholder="Например: герой находит письмо, которое сам написал десять лет назад, но никогда не помнит этого."></textarea></label>
        <div class="actions"><button>Создать черновик</button><span id="generation-status" class="hint"></span></div>
      </form>
    </section>

    <section>
      <div class="head"><h2>Текст новеллы</h2><span id="provider" class="hint"></span></div>
      <textarea id="draft" class="draft" maxlength="100000" placeholder="Здесь появится черновик. Его можно полностью отредактировать перед озвучкой. Длинные тексты автоматически озвучиваются частями."></textarea>
      <div class="actions voice-actions">
        <label>Скорость<select id="speed"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0× · обычно</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option></select></label>
        <label>Голос<select id="voice-selection"><option value="f5:xenia">Ксения · F5 Russian v2 (лучшее качество)</option><optgroup label="Silero v5.5"><option value="silero:aidar">Айдар</option><option value="silero:baya">Бая</option><option value="silero:kseniya">Ксения</option><option value="silero:eugene">Евгений</option><option value="silero:xenia">Xenia</option></optgroup></select></label>
        <button id="voice" type="button">Озвучить выбранным голосом</button>
        <span id="voice-status" class="hint"></span>
      </div>
      <div id="audio-result"></div>
      <div id="accent-editor" class="accent-editor">
        <div class="head"><h2>Исправить ударения</h2><button id="load-marked" class="quiet" type="button">Загрузить последнюю F5‑версию</button></div>
        <label>Ударения для повторной версии<textarea id="marked-text" class="draft" maxlength="100000" spellcheck="false" placeholder="Нажмите «Загрузить последнюю F5‑версию», затем поставьте + перед ударной гласной."></textarea></label>
        <p class="hint">Знак <code>+</code> ставится непосредственно перед ударной гласной: <code>термин+атор</code>, <code>войн+е</code>.</p>
        <button id="revoice" type="button">Переозвучить с правками</button>
      </div>
    </section>
  </main>
  <script src="/static/book.js?v=voices-v1"></script>
</body>
</html>
