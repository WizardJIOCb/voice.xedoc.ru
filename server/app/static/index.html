<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voice</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">VOICE.XEDOC.RU</p>
        <h1>Озвучка русских текстов</h1>
        <p>Очередь хранится на сервере, генерация — на локальной RTX 4070 Ti.</p>
      </div>
      <div class="header-actions"><a class="quiet link-button" href="/book">Создать новеллу</a><span id="worker">Проверяю worker…</span></div>
    </header>
    <section>
      <form id="form">
        <label>Текст<textarea id="text" maxlength="6000" required placeholder="Вставьте фрагмент книги…"></textarea></label>
        <div class="controls">
          <label>Движок<select id="engine"><option value="f5">F5 Russian v2 · выразительный</option><option value="silero">Silero v5.5 · быстрый CPU</option></select></label>
          <label>Ударения<select id="accent"><option value="auto">Авто · RUAccent</option><option value="manual">Уже размечены +</option></select></label>
          <label>Скорость<select id="speed"><option value="0.7">0.7× · медленнее</option><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1.0× · обычно</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option><option value="1.3">1.3× · быстрее</option></select></label>
          <button>Поставить в очередь</button>
        </div>
        <p class="hint">Ручная разметка: <code>зам+ок</code>.</p>
      </form>
    </section>
    <section>
      <div class="head"><h2>Последние задания</h2><button id="refresh" class="quiet" type="button">Обновить</button></div>
      <div id="jobs"></div>
    </section>
  </main>
  <script src="/static/app.js?v=accent-editor-v1"></script>
</body>
</html>
