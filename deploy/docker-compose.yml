services:
  web:
    build:
      context: ../server
      network: host
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    # На Linux-сервере это обходит нестабильный docker-proxy и оставляет
    # приложение доступным только через локальный Nginx на порту 8000.
    network_mode: host
    restart: unless-stopped
