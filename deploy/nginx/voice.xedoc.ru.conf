server {
    listen 80;
    listen [::]:80;
    server_name voice.xedoc.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/voice.xedoc.ru/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voice.xedoc.ru;
    ssl_certificate /etc/letsencrypt/live/voice.xedoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.xedoc.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 100m;

    location ^~ /api/worker/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8610;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 190s;
    }

    location / {
        proxy_pass http://127.0.0.1:8610;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 190s;
    }
}
